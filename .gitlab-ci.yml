stages:
- mirror
- mr
- dev
- preprod

include:
  - project: 'core2471/ci-tools'
    file: 'mirror/mirror-repo.yml'

check_apps:
  stage: mr
  trigger:
    include:
    - local: "apps/.gitlab-ci-mr.yml"
    strategy: depend
  except:
  - master
  - dev

build-apps:
  stage: dev
  trigger:
    include: apps/.gitlab-ci-dev.yml
    strategy: depend
  rules:
  - if: $CI_COMMIT_BRANCH == "dev"
    changes:
    - apps/**/*

realms:
  stage: dev
  trigger:
    include: realms/.gitlab-ci-dev.yml
    strategy: depend
  rules:
  - if: $CI_COMMIT_BRANCH == "dev"
    changes:
    - realms/**/*

clients:
  stage: dev
  trigger:
    include: clients/.gitlab-ci-dev.yml
    strategy: depend
  rules:
  - if: $CI_COMMIT_BRANCH == "dev"
    changes:
    - clients/**/*

build-apps-preprod:
  stage: preprod
  trigger:
    include: apps/.gitlab-ci-preprod.yml
    strategy: depend
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
    changes:
    - apps/**/*

realms-preprod:
  stage: preprod
  trigger:
    include: realms/.gitlab-ci-preprod.yml
    strategy: depend
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
    changes:
    - realms/**/*

clients-preprod:
  stage: preprod
  trigger:
    include: clients/.gitlab-ci-preprod.yml
    strategy: depend
  rules:
  - if: $CI_COMMIT_BRANCH == "master"
    changes:
    - clients/**/*
