stages:
  - mr
  - dev

check_apps:
  stage: mr
  trigger:
    include: 
      - local: "apps/.gitlab-ci-mr.yml"
    strategy: depend
  except:
    - master
    - dev

build-apps:
  stage: dev
  trigger:
    include: apps/.gitlab-ci-dev.yml
    strategy: depend
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      changes:
      - apps/**/*

