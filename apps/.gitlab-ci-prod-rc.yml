# Deploying helm chart to prod-rc
k8s-prod-rc-deploy:
  stage: prod-deploy
  image: 'nexus-rc.kacd.kz:5000/devops-utils/alpine-helm-docker:3.15al-3.11he-20.10d'
  # only:
  # - master
  environment:
    name: prod
  before_script:
  - cd apps
  - export RELEASE_NAME="${CI_PROJECT_NAME}"
  - mkdir -p /etc/deploy && export KUBECONFIG=/etc/deploy/config
  - echo ${KUBE_K8S_PROD_RC_CONFIG} | base64 -d > /etc/deploy/config
  script:
  - |-
    helm upgrade --install ${RELEASE_NAME} ./.helm \
      --create-namespace --namespace="${CI_PROJECT_NAME}" \
      -f ./.helm/prod-rc.yaml \
      --set image=nexus.kacd.kz:5000/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/keycloak:latest \
      --set realmController.image=nexus.kacd.kz:5000/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}/realm-controller:latest
