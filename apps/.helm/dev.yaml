global:
  imageRegistry: nexus.kacd.kz:5000
  imagePullSecrets:
  - kacd-docker-creds

image: nexus.kacd.kz:5000/valyayev/test/keycloak:0.3

replicaCount: 3

hostname: sso-dev.k8s-dev.kacd.kz

enabledMasterRealm: "true"

resources:
  limits:
    memory: "4Gi"
    cpu: "4"
  requests:
    memory: "1Gi"
    cpu: "1"

tls:
  enabled: true
  existingSecret: kacd-tls
  certificateFileKey: tls.crt
  keyFileKey: tls.key

auth:
  adminUser: admin
  existingSecret: "sso-keycloak-admin-password"
  existingSecretPasswordKey: password

database:
  host: psql-dev.kacd.kz
  name: keycloak
  schema: auth
  username: keycloak
  existingSecret: sso-keycloak-database-password
  existingSecretPasswordKey: password

service:
  type: ClusterIP
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "80"

ingress:
  enabled: true
  hostname: sso-dev.k8s-dev.kacd.kz
  tls: true
  secretName: kacd-tls
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 100k;
      large_client_header_buffers 4 100k;

realmController:
  enabled: true
  image: nexus.kacd.kz:5000/platform/sso/realm-controller:dev-1377
