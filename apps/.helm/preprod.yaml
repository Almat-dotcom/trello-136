global:
  imageRegistry: nexus.kacd.kz:5000
  imagePullSecrets:
  - kacd-docker-creds

image: nexus.kacd.kz:5000/valyayev/test/keycloak:0.3

replicaCount: 3

clusterDomain: k8s-cluster-preprod.local

hostname: sso-preprod.k8s-preprod.kacd.kz

enabledMasterRealm: "true"

debugAuth: true

resources:
  limits:
    memory: "640Mi"
    cpu: "1"
  requests:
    memory: "512Mi"
    cpu: "400m"

ncaUrl: https://kcsd-secure-nca.k8s-preprod.kacd.kz/platform/services/secure/nca/auth/v1/authenticate

mkbUrl: https://mkb-preprod.k8s-preprod.kacd.kz

tls:
  enabled: true
  existingSecret: kacd-tls
  certificateFileKey: tls.crt
  keyFileKey: tls.key

auth:
  adminUser: admin
  existingSecret: "sso-keycloak-admin-password"
  existingSecretPasswordKey: password

database:
  host: psql-preprod.kacd.kz
  name: sso
  schema: public
  username: sso
  existingSecret: sso-keycloak-database-password
  existingSecretPasswordKey: password

kafka:
  enabled: true
  bootstrapServers: "kafka-preprod.kacd.kz:9092"
  groupId: keycloak-preprod

service:
  type: ClusterIP
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"

ingress:
  enabled: true
  hostname: sso-preprod.k8s-preprod.kacd.kz
  tls: true
  secretName: kacd-tls

realmController:
  enabled: true
  image: nexus.kacd.kz:5000/platform/sso/realm-controller:dev-1377
