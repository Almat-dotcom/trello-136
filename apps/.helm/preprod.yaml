global:
  imageRegistry: nexus.kacd.kz:5000
  imagePullSecrets:
  - kacd-docker-creds

image: nexus.kacd.kz:5000/valyayev/test/keycloak:0.3

replicaCount: 1

hostname: sso-preprod.k8s-preprod.kacd.kz

enabledMasterRealm: "true"

resources:
  limits:
    memory: "4Gi"
    cpu: "4"
  requests:
    memory: "1Gi"
    cpu: "1"

tls:
  enabled: true
  existingSecret: kacd-tls
  certificateFileKey: tls.crt
  keyFileKey: tls.key

auth:
  adminUser: admin
  existingSecret: "sso-keycloak-admin-password"
  existingSecretPasswordKey: password

database:
  host: psql-preprod.kacd.kz
  name: sso
  schema: auth
  username: sso
  existingSecret: sso-keycloak-database-password
  existingSecretPasswordKey: password

service:
  type: ClusterIP
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"

ingress:
  enabled: true
  hostname: sso-preprod.k8s-preprod.kacd.kz
  tls: true
  secretName: kacd-tls
  annotations:
    nginx.ingress.kubernetes.io/affinity: cookie

realmController:
  enabled: true
  image: nexus.kacd.kz:5000/platform/sso/realm-controller:dev-1377
