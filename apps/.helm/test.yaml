global:
  imageRegistry: nexus.kacd.kz:5000
  # imagePullSecrets:
  # - kacd-docker-creds

image: nexus.kacd.kz:5000/valyayev/test/keycloak:0.3

command: ["/opt/keycloak/bin/kc.sh", "--verbose", "start", "--optimized"]

replicaCount: 1

clusterDomain: dev-cluster.local

hostname: sso-test.dev.kacd.kz

enabledMasterRealm: "true"

debugAuth: true

resources:
  limits:
    memory: "640Mi"
    cpu: "1"
  requests:
    memory: "512Mi"
    cpu: "400m"

ncaUrl: https://kcsd-secure-nca.dev.kacd.kz/platform/services/secure/nca/auth/v1/authenticate

mkbUrl: https://mkb-dev.dev.kacd.kz

tls:
  enabled: true
  existingSecret: kacd-tls
  certificateFileKey: tls.crt
  keyFileKey: tls.key

auth:
  adminUser: admin
  existingSecret: "sso-keycloak-admin-password"
  existingSecretPasswordKey: password

database:
  host: psql-dev.kacd.kz
  # name: keycloak-test
  name: sso-test-5
  # name: sso
  # schema: auth
  schema: public # схема для Препрода
  username: keycloak-test
  existingSecret: sso-keycloak-database-password
  existingSecretPasswordKey: password

# уровень логирования
loglevel: "INFO"

# kafka:
#   enabled: true
#   bootstrapServers: "kafka-dev.kacd.kz:9092"
#   groupId: keycloak-dev

service:
  type: ClusterIP
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"

ingress:
  enabled: true
  hostname: sso-test.dev.kacd.kz
  tls: true
  secretName: kacd-tls

realmController:
  enabled: true
  image: nexus.kacd.kz:5000/platform/sso/realm-controller:dev-1377
