version: '3.9'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    command: ["start-dev"]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_CACHE=ispn
      - JAVA_OPTS=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
    volumes:
      - ./conf/cache-ispn.xml:/opt/keycloak/conf/cache-ispn.xml
    ports:
      - 8080:8080

  redis:
    image: redis
    ports:
      - 6379:6379

  redis-insight:
    image: redislabs/redisinsight
    ports:
      - 8001:8001
