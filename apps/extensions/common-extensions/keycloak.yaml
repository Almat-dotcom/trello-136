version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    command: ["start-dev", "--import-realm"]
    environment:
    - KEYCLOAK_ADMIN=admin
    - KEYCLOAK_ADMIN_PASSWORD=admin
    - KC_DB=postgres
    - KC_DB_PASSWORD=keycloak
    - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
    - KC_DB_USERNAME=postgres
    - KC_LOG_LEVEL=info
    - MASTER_REALM_ENABLED=true
    - KC_CACHE=ispn
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - ENABLED_K8S=false
    volumes:
    - ./target/common-extensions-jar-with-dependencies.jar:/opt/keycloak/providers/common-extensions.jar:rw
    - ./test-realm.yaml:/opt/keycloak/.kacd/import/test-realm.yaml
    - ./cache-ispn.xml:/opt/keycloak/config/cache-ispn.xml
    ports:
    - "8080:8080"
  postgres:
    image: postgres
    environment:
    - POSTGRES_PASSWORD=keycloak
    - POSTGRES_DB=keycloak
    ports:
    - "5432:5432"
  redis:
    image: redis:7.0.9-alpine
    ports:
    - "6379:6379"
  redisinsight:
    image: redislabs/redisinsight:1.13.1
    ports:
    - "8001:8001"
