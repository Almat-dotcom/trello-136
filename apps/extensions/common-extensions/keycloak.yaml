version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    command: ["start-dev", "--import-realm"]
    environment:
    - KEYCLOAK_ADMIN=admin
    - KEYCLOAK_ADMIN_PASSWORD=admin
    - KC_DB=postgres
    - KC_DB_PASSWORD=keycloak
    - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak?user=postgres
    - KC_LOG_LEVEL=info
    - MASTER_REALM_ENABLED=true
    - KC_CACHE=ispn
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    # Enable Quarkus-level CORS so preflight OPTIONS is handled before realm-restapi-extension
    - KC_HTTP_CORS=true
    - KC_HTTP_CORS_ORIGINS=*
    - KC_HTTP_CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS,PATCH
    - KC_HTTP_CORS_ALLOWED_HEADERS=Authorization,Content-Type,Accept,Origin
    - KC_HTTP_CORS_EXPOSED_HEADERS=
    - KC_HTTP_CORS_MAX_AGE=3600
    - ENABLED_K8S=false
    volumes:
    - /Users/almatsagandykov/IdeaProjects/sso5/apps/extensions/common-extensions/target/common-extensions.jar:/opt/keycloak/providers/common-extensions.jar:rw
    - /Users/almatsagandykov/IdeaProjects/sso5/keycloak/standalone/lib/k8s-bundle.jar:/opt/keycloak/providers/k8s-bundle.jar:ro
    # All Fabric8 and transitive dependencies are shaded into k8s-bundle.jar; no extra jars needed
    - ./test-realm.yaml:/opt/keycloak/.kacd/import/test-realm.yaml
    - ./cache-ispn.xml:/opt/keycloak/config/cache-ispn.xml
    ports:
    - "8082:8080"
  postgres:
    image: postgres
    environment:
    - POSTGRES_PASSWORD=keycloak
    - POSTGRES_DB=keycloak
    ports:
    - "5439:5432"
  redis:
    image: redis:7.0.9-alpine
    ports:
    - "6379:6379"
  redisinsight:
    image: redislabs/redisinsight:1.13.1
    ports:
    - "8001:8001"
