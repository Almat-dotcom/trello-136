# K8s Client Provider Configuration
# Use 'default-k8s-client-provider' for direct Fabric8 usage (may cause 405 errors with Keycloak 23)
# Use 'isolated-k8s-client-provider' for isolated k8s-bundle usage (recommended for Keycloak 23)
k8s.client.provider=isolated-k8s-client-provider

# K8s Client Spec Provider Configuration
# Use 'default-k8s-client-provider' for direct Fabric8 usage
# Use 'isolated-k8s-client-provider' for isolated k8s-bundle usage
k8s.client.spec.provider=isolated-k8s-client-provider

