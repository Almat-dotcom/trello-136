apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clients.sso.kacd.kz
spec:
  group: sso.kacd.kz
  names:
    kind: Client
    listKind: ClientList
    plural: clients
    singular: client
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                clientId:
                  type: string
                name:
                  type: string
                description:
                  type: string
                protocol:
                  type: string
                publicClient:
                  type: boolean
                bearerOnly:
                  type: boolean
                serviceAccountsEnabled:
                  type: boolean
                enabled:
                  type: boolean
                redirectUris:
                  type: array
                  items:
                    type: string
                webOrigins:
                  type: array
                  items:
                    type: string
                attributes:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                state:
                  type: string
                  enum: [PENDING, APPLYING, APPLIED, FAILED, BACKOFF]
                message:
                  type: string
                generation:
                  type: string
                lastApplication:
                  type: string
