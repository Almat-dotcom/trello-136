apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: federations.kz.kacd.sso
spec:
  group: kz.kacd.sso
  names:
    kind: Federation
    listKind: FederationList
    plural: federations
    singular: federation
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                providerId:
                  type: string
                enabled:
                  type: boolean
                config:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                state:
                  type: string
                message:
                  type: string
                lastUpdateTime:
                  type: string
                  format: date-time

