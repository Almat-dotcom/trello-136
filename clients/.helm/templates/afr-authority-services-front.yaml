apiVersion: sso.kacd.kz/v1
kind: Client
metadata:
  name: afr-authority-services-front
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: afr-realm
    kz-kacd-realm-name: afr
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  displayedName: Front-End of authority services for AFR
  displayedDescription: Фронт приложения гос услуг личного кабинета АРРФР
  access:
    validRedirectUris:
    {{- include "common.tplvalues.render" ( dict "value" .Values.clients.afrAuthorityServicesFront.redirectUris "context" $ ) | nindent 4 }}
    webOrigins:
    {{- include "common.tplvalues.render" ( dict "value" .Values.clients.afrAuthorityServicesFront.webOrigins "context" $ ) | nindent 4 }}
  capability:
    type: PUBLIC
  attributes:
  - POSITION
  - FIRST_NAME
  - LAST_NAME
  - MIDDLE_NAME
  - GROUPS
  - LOCALE
  - IIN
  - PHONE_NUMBER
  roles: []
