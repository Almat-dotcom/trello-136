apiVersion: sso.kacd.kz/v1
kind: Client
metadata:
  name: api-manager
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: intenral-realm
    kz-kacd-realm-name: external
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  displayedName: API Manager
  displayedDescription: Сервис управления доступами к API
  access:
    validRedirectUris:
    - https://localhost:8080/*
    webOrigins:
    - "+"
  capability:
    type: CONFIDENTIAL
    clientExistingSecret: api-manager-secret
    clientSecretKey: client_secret
  attributes:
  - FIRST_NAME
  - LAST_NAME
  - MIDDLE_NAME
  - GROUPS
  - LOCALE
  - ORG
  - CLIENT_TYPE
  - IIN
  - EMAIL_VERIFIED
  - RESIDENCY
  - DIVISION
  - PHONE_NUMBER
  roles: []
