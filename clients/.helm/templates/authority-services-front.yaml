apiVersion: sso.kacd.kz/v1
kind: Client
metadata:
  name: authority-services-front
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    kz-kacd-realm-name: external
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  displayedName: Гос услуги Front-End
  displayedDescription: Фронт приложение Личного кабинета KSCD по гос услугам
  access:
    validRedirectUris:
    {{- include "common.tplvalues.render" ( dict "value" .Values.clients.lkShellFront.redirectUris "context" $ ) | nindent 4 }}
    webOrigins:
    {{- include "common.tplvalues.render" ( dict "value" .Values.clients.lkShellFront.webOrigins "context" $ ) | nindent 4 }}
  capability:
    type: PUBLIC
  attributes:
  - FIRST_NAME
  - LAST_NAME
  - MIDDLE_NAME
  - GROUPS
  - LOCALE
  - ORG
  - CLIENT_TYPE
  - IIN
  - EMAIL_VERIFIED
  - RESIDENCY
  - DIVISION
  - PHONE_NUMBER
  roles: [{
    name: signer,
    roleDescription: "Просмотр, создание, редактирование и подписание ЭЦП для отправки в уполномоченный орган заявлений и документов."
  }, {
    name: editor,
    roleDescription: "Просмотр, создание и редактирование заявлений и документов."
  }]
