apiVersion: sso.kacd.kz/v1
kind: Client
metadata:
  name: e-voting
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: internal-realm
    kz-kacd-realm-name: internal
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  displayedName: e-voting
  displayedDescription: Cервис для проведения электронных голосований команды ЛКД
  access:
    validRedirectUris:
    - http://localhsot:4200
    webOrigins:
    - "+"
  capability:
    type: PUBLIC
  attributes:
  - FIRST_NAME
  - LAST_NAME
  - MIDDLE_NAME
  - GROUPS
  - LOCALE
  roles: [{
    name: backoffice-e-voting-reader,
    roleDescription: 'Просмотр журнала собраний акционеров, заявления (информации об обществе, о корпоративном событии), скачивание вложенных документов'
  }, {
    name: backoffice-e-voting-approver,
    roleDescription: 'Согласование/отклонение заявления на получение услуги  по осуществлению функций счетной комиссии'
  }, {
    name: backoffice-e-voting-chairman,
    roleDescription: 'Назначение/изменение состава счетной комиссии'
  }]