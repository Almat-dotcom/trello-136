apiVersion: sso.kacd.kz/v1
kind: Client
metadata:
  name: kacd-legacy-portal
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    kz-kacd-realm-name: external
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  displayedName: Legacy KACD Portal
  displayedDescription: Клиент старого портала
  access:
    validRedirectUris:
    {{- include "common.tplvalues.render" ( dict "value" .Values.clients.lkShellFront.redirectUris "context" $ ) | nindent 4 }}
    webOrigins:
    {{- include "common.tplvalues.render" ( dict "value" .Values.clients.lkShellFront.webOrigins "context" $ ) | nindent 4 }}
  capability:
    type: PUBLIC
  attributes:
  - FIRST_NAME
  - LAST_NAME
  - MIDDLE_NAME
  - GROUPS
  - LOCALE
  - ORG
  - CLIENT_TYPE
  - IIN
  - EMAIL_VERIFIED
  - RESIDENCY
  - DIVISION
  - PHONE_NUMBER
  roles: [{
    name: dockacd,
    roleDescription: Доступ к Dockacd
  }, {
    name: infodoc,
    roleDescription: Доступ к Infodoc
  }, {
    name: news,
    roleDescription: Доступ к новостям
  }, {
    name: pfi,
    roleDescription: Доступ к PFI
  }]
