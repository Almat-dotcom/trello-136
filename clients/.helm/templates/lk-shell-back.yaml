apiVersion: sso.kacd.kz/v1
kind: Client
metadata:
  name: lk-shell-back
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: internal-realm
    kz-kacd-realm-name: internal
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  displayedName: LK Shell Back-End
  displayedDescription: Back-end личного кабинета для доступа к внутренним сервисам
  access:
    validRedirectUris:
    {{- include "common.tplvalues.render" ( dict "value" .Values.clients.lkShellBack.redirectUris "context" $ ) | nindent 4 }}
    webOrigins:
    {{- include "common.tplvalues.render" ( dict "value" .Values.clients.lkShellBack.webOrigins "context" $ ) | nindent 4 }}
  capability:
    type: CONFIDENTIAL
    clientExistingSecret: lk-shell-back-secret
    clientSecretKey: client_secret
  scope:
    name: lk-access
    scopeDescription: Получить доступ к API личного кабинета
  roles: []
