apiVersion: sso.kacd.kz/v1
kind: Client
metadata:
  name: lk-shell-front
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: intenral-realm
    kz-kacd-realm-name: external
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  displayedName: LK Shell Front-End
  displayedDescription: Фронт приложение Личного кабинета KSCD
  access:
    validRedirectUris:
    {{- include "common.tplvalues.render" ( dict "value" .Values.clients.lkShellFront.redirectUris "context" $ ) | nindent 4 }}
    webOrigins:
    {{- include "common.tplvalues.render" ( dict "value" .Values.clients.lkShellFront.webOrigins "context" $ ) | nindent 4 }}
  capability:
    type: PUBLIC
  attributes:
  - FIRST_NAME
  - LAST_NAME
  - MIDDLE_NAME
  - GROUPS
  - LOCALE
  - ORG
  - CLIENT_TYPE
  - IIN
  - EMAIL_VERIFIED
  - RESIDENCY
  - DIVISION
  - PHONE_NUMBER
  - PHONE_NUMBER_VERIFIED
  roles: [{
    name: issuer,
    roleDescription: Эмитент
  }, {
    name: depositor,
    roleDescription: Депонент
  }, {
    name: shareholder,
    roleDescription: Держатель
  }, {
    name: reporting_person,
    roleDescription: "Информирующее лицо"
  }, {
    name: custodian,
    roleDescription: Кастодиан
  }, {
    name: client-bank,
    roleDescription: Банк-клиент
  }, {
    name: pfi,
    roleDescription: Доступ к PFI
  }]
