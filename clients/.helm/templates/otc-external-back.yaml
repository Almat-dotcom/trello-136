apiVersion: sso.kacd.kz/v1
kind: Client
metadata:
  name: otc-external-back
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    kz-kacd-realm-name: external
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  displayedName: OTC external Back-End
  displayedDescription: Back-end otc для доступа к внутренним сервисам
  access:
    validRedirectUris:
    {{- include "common.tplvalues.render" ( dict "value" .Values.clients.lkShellBack.redirectUris "context" $ ) | nindent 4 }}
    webOrigins:
    {{- include "common.tplvalues.render" ( dict "value" .Values.clients.lkShellBack.webOrigins "context" $ ) | nindent 4 }}
  capability:
    type: CONFIDENTIAL
    clientExistingSecret: otc-external-back-secret
    clientSecretKey: client_secret
  roles: []
