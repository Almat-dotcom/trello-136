apiVersion: sso.kacd.kz/v1
kind: Client
metadata:
  name: unclaimed-money-id
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: internal-realm
    kz-kacd-realm-name: internal
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  displayedName: unclaimed-money-id
  displayedDescription: Модуль "Невостребованные деньги", "Выплата ИД" в BackOffice System команды ЛКД
  access:
    validRedirectUris:
    - http://localhsot:4200
    webOrigins:
    - "+"
  capability:
    type: CONFIDENTIAL
    clientExistingSecret: unclaimed-money-id-secret
    clientSecretKey: client_secret
  attributes:
  - FIRST_NAME
  - LAST_NAME
  - MIDDLE_NAME
  - GROUPS
  - LOCALE
  roles: [{
    name: backoffice-um-id-editor,
    roleDescription: 'Пользователи с этой ролью имеют доступ к просмотру созданных заявлений в журнале, созданию новых заявлений на выплату ИД и отмену созданных заявлений, в модуле "Невостребованные деньги", подраздел "Получатели денег" в BackOffice'
  }, {
    name: backoffice-um-id-approver,
    roleDescription: 'Пользователи с этой ролью могут просматривать, подтверждать, отменять и отправлять на доработку созданные заявления на выплату ИД и создавать новые заявления.'
  }, {
    name: backoffice-um-id-reader,
    roleDescription: 'Пользователи с этой ролью имеют доступ только для просмотра и скачивания созданных заявлений  в модуле "Невостребованные деньги", подраздел "Получатели денег" в BackOffice System.'
  }]