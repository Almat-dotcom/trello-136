apiVersion: sso.kacd.kz/v1
kind: Client
metadata:
  name: unclaimed-money-tax
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: internal-realm
    kz-kacd-realm-name: internal
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  displayedName: unclaimed-money-tax
  displayedDescription: Модуль Выплаты ИД и налоги для Продукта ЛКД
  access:
    validRedirectUris:
    - http://localhsot:4200
    webOrigins:
    - "+"
  capability:
    type: PUBLIC
  attributes:
  - FIRST_NAME
  - LAST_NAME
  - MIDDLE_NAME
  - GROUPS
  - LOCALE
  roles: [{
    name: backoffice-um-obu-signer,
    roleDescription: 'Полный доступ к разделам, связанным с бухгалтерией. Отправка на выплату налога. Отклонения отчета. Просмотр собственного профиля пользователя.'
  }, {
    name: backoffice-um-fo-signer,
    roleDescription: 'Просмотр приказов по лицевым счетам физических и юридических лиц раздела "Операции со счетами"'
  }, {
    name: backoffice-um-reader,
    roleDescription: 'Просмотр журнала и детализации без возможности вносить изменения. Скачивание созданных отчетов'
  }]