apiVersion: sso.kacd.kz/v1
kind: Client
metadata:
  name: custodian-service
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: internal-realm
    kz-kacd-realm-name: internal
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  displayedName: custodian-service
  displayedDescription: Сервис для работы с custodian команды РЕЕСТР
  access:
    validRedirectUris:
    - http://localhsot:4200
    webOrigins:
    - "+"
  capability:
    type: CONFIDENTIAL
    clientExistingSecret: custodian-service-secret
    clientSecretKey: client_secret
  attributes:
    - FIRST_NAME
    - LAST_NAME
    - MIDDLE_NAME
    - GROUPS
    - LOCALE
  roles: [{
    name: backoffice-custodian-read-orders,
    roleDescription: 'Разрешает смотреть список приказов'
  }, {
    name: backoffice-custodian-read-order,
    roleDescription: 'Разрешает смотреть  детали приказа'
  }, {
    name: backoffice-custodian-download-order,
    roleDescription: 'Разрешает скачивать  pdf приказа'
  }, {
    name: backoffice-custodian-download-report,
    roleDescription: 'Разрешает скачивать  pdf отчета ЦД'
  }]

