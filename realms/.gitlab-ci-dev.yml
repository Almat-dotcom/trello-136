stages:
- dev-deploy

dev-deploy-realms:
  stage: dev-deploy
  image: 'nexus.kacd.kz:5000/devops-utils/alpine-helm-docker:3.15al-3.11he-20.10d'
  only:
  - dev
  environment:
    name: dev
  before_script:
  - cd realms
  - export RELEASE_NAME="realms-${CI_PROJECT_NAME}"
  - mkdir -p /etc/deploy && export KUBECONFIG=/etc/deploy/config
  - echo ${KUBE_K8S_DEV_CONFIG} | base64 -d > /etc/deploy/config
  script:
  - |-
    helm upgrade --install ${RELEASE_NAME} ./.helm \
      --create-namespace --namespace="${CI_PROJECT_NAME}-dev" \
      -f ./.helm/dev.yaml
