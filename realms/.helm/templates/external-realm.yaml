{{- if .Values.external.enabled }}
apiVersion: sso.kacd.kz/v1
kind: Realm
metadata:
  name: external
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: intenral-realm
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  # Отображаемое имя на странице авторизации
  displayedName: KCSD
  # Базовый URL для доступа к реалму (Важно! Для админки динамически не изменяются хосты)
  frontendUrl: {{ printf "https://%s" .Values.external.hostname }}
  # Любые запросы могут быть по HTTP
  requireSsl: none
  login:
    loginScreen:
      # Регистрация разрешена
      registration: true
      # Восстановление пароля включено
      forgotPassword: true
      # Запомни меня включено
      rememberMe: true
    email:
      # Из-за дублирования email-ов, запрещается вход через email
      loginWithEmail: true
      # Обязательно Email должен быть подтвержден
      verifyEmail: true
  # Настройки SMTP сервера для рассылки
  email:
    from: sso@kacd.kz
    displayedName: KCSD
    smtpHost: mail.kacd.kz
    smtpPort: 5252
    encryption: []
  # Настройки тем для модулей входа, админки, профиля и почтовой рассылки
  themes: 
    login: external
    account: keycloak.v2
    admin: keycloak.v2
    email: external
    # Локализация на 3 языка
    localization:
      i18n: true
      supportedLocales: ["en", "ru", "kz"]
      defaultLocale: ru
  events:
    # Список слушателей событий. Стандартный слушатель для логирования событий.
    eventListeners: ["jboss-logging", "metrics-listener","phone-verifier-listener"]
    # Включить события пользователей и хранить их 7 дней
    userEvents:
      saveEvents: true
      expiration: 7d
    # Включить события администрирования и хранить их 7 дней
    adminEvents:
      saveEvents: true
      includeRepresentation: true
      expiration: 7d
  security:
    # Включить защиту от взлома пароля по методу brute force
    bruteForce:
      enabled: true
      maxLoginFailures: 5
  # Настройки сессий
  sessions:
    sso:
      sessionIdle: 60m
      sessionMax: 24h
    client:
      sessionIdle: 60m
      sessionMax: 24h
  tokens:
    accessLifespan: 30m
    oidcAccessLifespan: 30m
  # Настройки аутентификации
  authentication:
    # Потоки аутентификации
    flows:
      # При входе в систему через браузер
      browser: EXTERNAL
      # При регистрации нового пользователя
      registration: EXTERNAL
    # Политики паролей
    passwordPolicy:
      # Срок пароля истекает через 30 дней
      expiration: 30
      # Новый пароль не должен совпадать как минимум с 7 предыдущими паролями
      notRecentlyUsed: 7
      # Минимальная длина пароля должна быть 8 символов
      minimumLength: 8
      # Пароль должен содержать как минимум 1 спец символ
      countOfSpecialChars: 1
      # Пароль должен содержать как минимум 1 символ в верхнем регистре
      uppercaseChars: 1
      # Пароль должен содержать как минимум 1 символ в нижнем регистре
      lowercaseChars: 1
      # Пароль должен содержать как минимум 1 цифру
      numberOfDigits: 1
{{- end }}