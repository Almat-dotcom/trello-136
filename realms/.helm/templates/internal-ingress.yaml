apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-internal" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.annotations }}
    {{- include "common.tplvalues.render" (dict "value" .Values.ingress.annotations "context" $) | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.hostname.internal }}
      http:
        paths:
        - path: /realms/internal
          pathType: Prefix
          backend:
            service:
              name: {{ .Values.ingress.serviceName }}
              port:
                name: http
        - path: /resources
          pathType: Prefix
          backend:
            service:
              name: {{ .Values.ingress.serviceName }}
              port:
                name: http
  tls:
  {{- if and .Values.ingress.tls (or (include "common.ingress.certManagerRequest" ( dict "annotations" .Values.ingress.annotations )) .Values.ingress.secrets .Values.ingress.selfSigned) }}
    - hosts:
        - {{ (tpl .Values.hostname.internal .) | quote }}
      secretName: {{ printf "%s-tls" (tpl .Values.hostname.internal .) }}
  {{- end }}
