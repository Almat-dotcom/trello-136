
#
# Hostnames of realms
#
hostname: 
  internal: internal.localhost
  external: external.localhost

#
# Settings of LDAP
#
ldap:
  #
  # URL to ldap
  #
  url: ldap://localhost:389
  #
  # Settings of secret which contains authentication params for ldap connection
  #
  existingSecret: ""
  dnKey: ""
  passwordKey: ""
  #
  # DN of UO to search users
  #
  usersDn: ""
  #
  # DN of UO to search groups
  #
  groupsDn: ""

#
# Override namespace of the release
#
namespaceOverride: ""

#
# Sets common labels on all objects created
#
commonLabels: {}

#
# Sets common annotations on all objects created
#
commonAnnotations: {}

#
# Settings of the ingress
#
ingress:
  #
  # Name of the backend service
  #
  serviceName: ""
  ingressClassName: ""
  ## @param ingress.tls Enable TLS configuration for the host defined at `ingress.hostname` parameter
  ## TLS certificates will be retrieved from a TLS secret with name: `{{- printf "%s-tls" (tpl .Values.ingress.hostname .) }}`
  ## You can:
  ##   - Use the `ingress.secrets` parameter to create this TLS secret
  ##   - Rely on cert-manager to create it by setting the corresponding annotations
  ##   - Rely on Helm to create self-signed certificates by setting `ingress.selfSigned=true`
  ##
  tls: false
  secretName: ""
  ## @param ingress.selfSigned Create a TLS secret for this ingress record using self-signed certificates generated by Helm
  ##
  selfSigned: false
  ## @param ingress.secrets If you're providing your own certificates, please use this to add the certificates as secrets
  ## key and certificate should start with -----BEGIN CERTIFICATE----- or
  ## -----BEGIN RSA PRIVATE KEY-----
  ##
  ## name should line up with a tlsSecret set further up
  ## If you're using cert-manager, this is unneeded, as it will create the secret for you if it is not set
  ##
  ## It is also possible to create and manage the certificates outside of this helm chart
  ## Please see README.md for more information
  ## e.g:
  ## - name: keycloak.local-tls
  ##   key:
  ##   certificate:
  ##
  secrets: []
  ## @param ingress.annotations [object] Additional annotations for the Ingress resource. To enable certificate autogeneration, place here your cert-manager annotations.
  ## Use this parameter to set the required annotations for cert-manager, see
  ## ref: https://cert-manager.io/docs/usage/ingress/#supported-annotations
  ## e.g:
  ## annotations:
  ##   kubernetes.io/ingress.class: nginx
  ##   cert-manager.io/cluster-issuer: cluster-issuer-name
  ##
  annotations: {}
